    // 1. CALCULATOR MODAL (POPUP ON AMOUNT FIELD)
    function CalculatorModal({ isOpen, onClose, onSelectAmount }) {
      const [display, setDisplay] = useState('0');
      const [formula, setFormula] = useState('');
      const [isDone, setIsDone] = useState(false);

      if (!isOpen) return null;

      const handleDigit = (digit) => {
        if (isDone) {
          setDisplay(digit);
          setFormula('');
          setIsDone(false);
          return;
        }
        if (display === '0') setDisplay(digit);
        else setDisplay(display + digit);
      };

      const handleDecimal = () => {
        if (isDone) {
          setDisplay('0.');
          setFormula('');
          setIsDone(false);
          return;
        }
        const parts = display.split(/[+\-*/]/);
        const lastPart = parts[parts.length - 1];
        if (!lastPart.includes('.')) setDisplay(display + '.');
      };

      const handleOperator = (op) => {
        setIsDone(false);
        const lastChar = display[display.length - 1];
        if (['+', '-', '*', '/'].includes(lastChar)) {
          setDisplay(display.slice(0, -1) + op);
        } else {
          setDisplay(display + op);
        }
      };

      const handlePercent = () => {
        const parts = display.split(/[+\-*/]/);
        const lastPart = parts[parts.length - 1];
        if (!lastPart || lastPart === '0') return;
        const value = parseFloat(lastPart) / 100;
        const beforePart = display.slice(0, display.length - lastPart.length);
        setDisplay(beforePart + value.toString());
      };

      const handleClear = () => {
        setDisplay('0');
        setFormula('');
        setIsDone(false);
      };

      const handleBackspace = () => {
        if (isDone) { handleClear(); return; }
        if (display.length > 1) setDisplay(display.slice(0, -1));
        else setDisplay('0');
      };

      const handleCalculate = () => {
        if (isDone) return;
        let expr = display;
        const lastChar = expr[expr.length - 1];
        if (['+', '-', '*', '/'].includes(lastChar)) expr = expr.slice(0, -1);

        try {
          const result = evaluateExpression(expr);
          const roundedResult = Math.round(result * 10000) / 10000;
          setFormula(expr + '=');
          setDisplay(roundedResult.toString());
          setIsDone(true);
        } catch {
          setDisplay('Error');
          setIsDone(true);
        }
      };

      const evaluateExpression = (expr) => {
        const tokens = [];
        let numberBuffer = '';
        for (let i = 0; i < expr.length; i++) {
          const char = expr[i];
          if (/[0-9.]/.test(char)) numberBuffer += char;
          else if (['+', '-', '*', '/'].includes(char)) {
            if (numberBuffer) { tokens.push(parseFloat(numberBuffer)); numberBuffer = ''; }
            tokens.push(char);
          }
        }
        if (numberBuffer) tokens.push(parseFloat(numberBuffer));
        if (tokens.length === 0) return 0;

        const firstPass = [];
        let i = 0;
        while (i < tokens.length) {
          const token = tokens[i];
          if (token === '*' || token === '/') {
            const prev = firstPass.pop();
            const next = tokens[i + 1];
            if (prev === undefined || next === undefined) throw new Error();
            const val = token === '*' ? prev * next : prev / next;
            firstPass.push(val);
            i += 2;
          } else {
            firstPass.push(token);
            i++;
          }
        }

        let result = firstPass[0];
        let j = 1;
        while (j < firstPass.length) {
          const op = firstPass[j];
          const val = firstPass[j + 1];
          if (op === '+') result += val;
          else if (op === '-') result -= val;
          j += 2;
        }
        return result;
      };

      const handleApply = () => {
        let finalVal = display;
        if (/[+\-*/]/.test(display) && !isDone) {
          let expr = display;
          const lastChar = expr[expr.length - 1];
          if (['+', '-', '*', '/'].includes(lastChar)) expr = expr.slice(0, -1);
          try {
            const res = evaluateExpression(expr);
            finalVal = (Math.round(res * 100) / 100).toString();
          } catch {
            finalVal = '0';
          }
        }
        const numericVal = parseFloat(finalVal);
        onSelectAmount(isNaN(numericVal) ? 0 : numericVal);
        onClose();
      };

      return (
        <div className="modal-overlay" style={{ alignItems: 'center' }} onClick={onClose}>
          <div className="modal-content" style={{ width: '90%', maxWidth: '360px', borderRadius: '24px' }} onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <div className="modal-title">ক্যালকুলেটর</div>
              <button type="button" className="icon-button" onClick={onClose}><XIcon size={20} /></button>
            </div>
            <div>
              <div className="calc-display">
                {formula && <div className="calc-formula">{toBanglaDigits(formula)}</div>}
                <div>{toBanglaDigits(display)}</div>
              </div>
              <div className="calculator-grid">
                <button type="button" className="calc-btn op" onClick={handleClear}>C</button>
                <button type="button" className="calc-btn op" onClick={handleBackspace}><BackspaceIcon size={20}/></button>
                <button type="button" className="calc-btn op" onClick={handlePercent}>%</button>
                <button type="button" className="calc-btn op" onClick={() => handleOperator('/')}>÷</button>
                <button type="button" className="calc-btn" onClick={() => handleDigit('7')}>7</button>
                <button type="button" className="calc-btn" onClick={() => handleDigit('8')}>8</button>
                <button type="button" className="calc-btn" onClick={() => handleDigit('9')}>9</button>
                <button type="button" className="calc-btn op" onClick={() => handleOperator('*')}>×</button>
                <button type="button" className="calc-btn" onClick={() => handleDigit('4')}>4</button>
                <button type="button" className="calc-btn" onClick={() => handleDigit('5')}>5</button>
                <button type="button" className="calc-btn" onClick={() => handleDigit('6')}>6</button>
                <button type="button" className="calc-btn op" onClick={() => handleOperator('-')}>-</button>
                <button type="button" className="calc-btn" onClick={() => handleDigit('1')}>1</button>
                <button type="button" className="calc-btn" onClick={() => handleDigit('2')}>2</button>
                <button type="button" className="calc-btn" onClick={() => handleDigit('3')}>3</button>
                <button type="button" className="calc-btn op" onClick={() => handleOperator('+')}>+</button>
                <button type="button" className="calc-btn" style={{ gridColumn: 'span 2' }} onClick={() => handleDigit('0')}>0</button>
                <button type="button" className="calc-btn" onClick={handleDecimal}>.</button>
                <button type="button" className="calc-btn eq" onClick={handleCalculate}>=</button>
              </div>
              <div style={{ marginTop: '20px' }}>
                <button type="button" className="btn btn-primary" style={{ width: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: '8px' }} onClick={handleApply}>
                  <CheckIcon size={18} /> হিসাবে যোগ করুন
                </button>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // 2. TRANSACTION ENTRY AND MODIFICATION FORM
    function TransactionForm({ isOpen, onClose, onSave, transactionToEdit, categories, nextSerial }) {
      const [description, setDescription] = useState('');
      const [personName, setPersonName] = useState('');
      const [amount, setAmount] = useState('');
      const [categoryType, setCategoryType] = useState('expense');
      
      const [status, setStatus] = useState('paid');
      const [paidAmountInput, setPaidAmountInput] = useState('');
      
      const [date, setDate] = useState('');
      const [time, setTime] = useState('');
      const [note, setNote] = useState('');
      const [isCalcOpen, setIsCalcOpen] = useState(false);

      useEffect(() => {
        if (!transactionToEdit) {
          if (categoryType === 'expense') setStatus('paid');
          else setStatus('pending');
        }
      }, [categoryType, transactionToEdit]);

      useEffect(() => {
        if (isOpen) {
          if (transactionToEdit) {
            setDescription(transactionToEdit.description || '');
            setPersonName(transactionToEdit.personName || '');
            setAmount(transactionToEdit.amount ? transactionToEdit.amount.toString() : '');
            setCategoryType(transactionToEdit.categoryType || 'expense');
            setStatus(transactionToEdit.status || 'paid');
            setPaidAmountInput(transactionToEdit.paidAmount ? transactionToEdit.paidAmount.toString() : '');
            setDate(transactionToEdit.date || '');
            setTime(transactionToEdit.time || '');
            setNote(transactionToEdit.note || '');
          } else {
            setDescription('');
            setPersonName('');
            setAmount('');
            setCategoryType('expense');
            setStatus('paid');
            setPaidAmountInput('');
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            setDate(`${yyyy}-${mm}-${dd}`);
            const hh = String(today.getHours()).padStart(2, '0');
            const min = String(today.getMinutes()).padStart(2, '0');
            setTime(`${hh}:${min}`);
            setNote('');
          }
        }
      }, [isOpen, transactionToEdit]);

      if (!isOpen) return null;

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!description.trim()) { alert('অনুগ্রহ করে বিবরণ লিখুন!'); return; }
        
        if (categoryType !== 'expense' && !personName.trim()) {
          alert('অনুগ্রহ করে ব্যক্তির নাম লিখুন!');
          return;
        }

        const numericAmount = parseBanglaFloat(amount);
        if (isNaN(numericAmount) || numericAmount <= 0) { alert('অনুগ্রহ করে সঠিক টাকার পরিমাণ লিখুন!'); return; }

        let finalPaid = 0;
        if (status === 'paid') {
          finalPaid = numericAmount;
        } else if (status === 'partial') {
          const parsedPaid = parseBanglaFloat(paidAmountInput);
          if (isNaN(parsedPaid) || parsedPaid <= 0) { alert('সঠিক পরিশোধিত টাকার পরিমাণ লিখুন!'); return; }
          if (parsedPaid >= numericAmount) { alert('পরিশোধিত টাকা মোট টাকার চেয়ে কম হতে হবে!'); return; }
          finalPaid = parsedPaid;
        } else {
          finalPaid = 0;
        }

        onSave({
          id: transactionToEdit && transactionToEdit.id && !transactionToEdit.id.startsWith('prefill-') ? transactionToEdit.id : 'tx-' + Date.now(),
          serial: transactionToEdit && transactionToEdit.serial ? transactionToEdit.serial : nextSerial,
          description: description.trim(),
          personName: personName.trim(),
          amount: numericAmount,
          categoryType,
          status,
          paidAmount: finalPaid,
          pendingAmount: numericAmount - finalPaid,
          date,
          time,
          note: note.trim()
        });
        onClose();
      };

      return (
        <>
          <div className="modal-overlay" onClick={onClose}>
            <div className="modal-content" onClick={(e) => e.stopPropagation()}>
              <div className="modal-header">
                <div className="modal-title">
                  {transactionToEdit && transactionToEdit.id && !transactionToEdit.id.startsWith('prefill-') ? 'হিসাব সংশোধন' : 'নতুন হিসাব লিখুন'}
                  <span style={{ fontSize: '14px', color: 'var(--text-muted)', marginLeft: '10px', fontWeight: 'normal' }}>
                    (ক্রমিক: {padSerial(transactionToEdit && transactionToEdit.serial ? transactionToEdit.serial : nextSerial)})
                  </span>
                </div>
                <button type="button" className="icon-button" onClick={onClose}><XIcon size={22} /></button>
              </div>
              <form onSubmit={handleSubmit}>
                <div className="form-group">
                  <label className="form-label">বিবরণ *</label>
                  <input type="text" className="form-input" placeholder="যেমন: বাজার খরচ, বন্ধুদের সাথে খাওয়া" value={description} onChange={(e) => setDescription(e.target.value)} required />
                </div>

                <div className="form-group">
                  <label className="form-label">{
                    categoryType === 'borrowed' ? 'কার কাছ থেকে ধার নিয়েছেন? (ব্যক্তির নাম) *' :
                    categoryType === 'receivable' ? 'কার কাছ থেকে টাকা পাবেন? (ব্যক্তির নাম) *' :
                    categoryType === 'owed' ? 'কে বাকি টাকা পাবে? (ব্যক্তির নাম/দোকান) *' :
                    'দোকান বা প্রতিষ্ঠানের নাম (ঐচ্ছিক)'
                  }</label>
                  <input type="text" className="form-input" placeholder={
                    categoryType === 'borrowed' ? 'যেমন: করিম, রহিম' :
                    categoryType === 'receivable' ? 'যেমন: রফিক, জামিল' :
                    categoryType === 'owed' ? 'যেমন: আব্দুর রহমান, আব্দুল স্টোর' :
                    'যেমন: স্বপ্ন সুপার শপ'
                  } value={personName} onChange={e=>setPersonName(e.target.value)} required={categoryType !== 'expense'} />
                </div>

                <div className="form-row">
                  <div className="form-group">
                    <label className="form-label">মোট টাকার পরিমাণ *</label>
                    <div className="input-container">
                      <input type="text" className="form-input input-with-action" placeholder="৳ ০.০০" value={amount} onChange={(e) => setAmount(e.target.value)} required />
                      <button type="button" className="input-action-btn" onClick={() => setIsCalcOpen(true)}><CalculatorIcon size={18}/></button>
                    </div>
                  </div>
                  <div className="form-group">
                    <label className="form-label">হিসাবের ধরন *</label>
                    <select className="form-select" value={categoryType} onChange={(e) => setCategoryType(e.target.value)}>
                      <option value="borrowed">{categories.borrowed}</option>
                      <option value="receivable">{categories.receivable}</option>
                      <option value="expense">{categories.expense}</option>
                      <option value="owed">{categories.owed}</option>
                    </select>
                  </div>
                </div>

                <div className="form-row">
                  <div className="form-group">
                    <label className="form-label">পরিশোধের অবস্থা *</label>
                    <select className="form-select" value={status} onChange={(e) => setStatus(e.target.value)}>
                      <option value="pending">পরিশোধ করা হয়নি (বাকি)</option>
                      <option value="partial">আংশিক পরিশোধিত</option>
                      <option value="paid">সম্পূর্ণ পরিশোধিত</option>
                    </select>
                  </div>
                  {status === 'partial' ? (
                    <div className="form-group">
                      <label className="form-label">পরিশোধিত টাকা *</label>
                      <input type="text" className="form-input" placeholder="৳ ০.০০" value={paidAmountInput} onChange={(e) => setPaidAmountInput(e.target.value)} required />
                    </div>
                  ) : (
                    <div className="form-group">
                      <label className="form-label">অবশিষ্ট বকেয়া</label>
                      <div className="form-input" style={{ backgroundColor: '#e2e8f0', color: 'var(--text-muted)', fontWeight: 'bold' }}>
                        {status === 'paid' ? '৳০.০০' : `৳${amount || '০.০০'}`}
                      </div>
                    </div>
                  )}
                </div>

                <div className="form-row">
                  <div className="form-group">
                    <label className="form-label">তারিখ *</label>
                    <input type="date" className="form-input" value={date} onChange={(e) => setDate(e.target.value)} required />
                  </div>
                  <div className="form-group">
                    <label className="form-label">সময় *</label>
                    <input type="time" className="form-input" value={time} onChange={(e) => setTime(e.target.value)} required />
                  </div>
                </div>
                <div className="form-group">
                  <label className="form-label">বিশেষ নোট (ঐচ্ছিক)</label>
                  <textarea className="form-textarea" rows="2" placeholder="অন্যান্য তথ্য..." value={note} onChange={(e) => setNote(e.target.value)} />
                </div>
                <div className="form-actions">
                  <button type="button" className="btn btn-secondary" onClick={onClose}>বাতিল</button>
                  <button type="submit" className="btn btn-primary">{transactionToEdit && transactionToEdit.id && !transactionToEdit.id.startsWith('prefill-') ? 'পরিবর্তন সংরক্ষণ করুন' : 'হিসাব যুক্ত করুন'}</button>
                </div>
              </form>
            </div>
          </div>
          <CalculatorModal isOpen={isCalcOpen} onClose={() => setIsCalcOpen(false)} onSelectAmount={(val) => setAmount(val.toString())} />
        </>
      );
    }

    // 3. DASHBOARD PAGE
    function Dashboard({ transactions, categories, onAddClick, onViewSubTab }) {
      const getTotals = () => {
        let iOwe = 0; let theyOwe = 0; let totalPaid = 0; let totalPending = 0; let totalPartial = 0;
        let todayPaid = 0; let monthPaid = 0;
        const todayStr = new Date().toISOString().split('T')[0];
        const currentMonthStr = todayStr.substring(0, 7);

        transactions.forEach(tx => {
          const paid = tx.paidAmount || 0;
          const pending = tx.pendingAmount || 0;
          const type = tx.categoryType;
          const status = tx.status || 'paid';

          if (type === 'borrowed' || type === 'owed') iOwe += pending;
          if (type === 'receivable') theyOwe += pending;

          totalPaid += paid;
          totalPending += pending;

          if (status === 'partial') totalPartial += pending;
          if (tx.date === todayStr) todayPaid += paid;
          if (tx.date.startsWith(currentMonthStr)) monthPaid += paid;
        });
        return { iOwe, theyOwe, totalPaid, totalPending, totalPartial, todayPaid, monthPaid };
      };

      const totals = getTotals();

      const getCategoryStats = (type) => {
        const filtered = transactions.filter(t => t.categoryType === type);
        const count = filtered.length;
        const total = filtered.reduce((sum, t) => sum + t.amount, 0);
        const sorted = [...filtered].sort((a, b) => {
          const dateA = a.date + 'T' + (a.time || '00:00');
          const dateB = b.date + 'T' + (b.time || '00:00');
          return dateB.localeCompare(dateA);
        });
        const latest = sorted[0] ? `${sorted[0].description} (${formatBanglaCurrency(sorted[0].amount)})` : 'কোন হিসাব নেই';
        return { count, total, latest };
      };

      const recentTransactions = [...transactions]
        .sort((a, b) => (b.date + 'T' + (b.time || '00:00')).localeCompare(a.date + 'T' + (a.time || '00:00')))
        .slice(0, 4)
        .sort((a, b) => {
          const nameA = (a.personName || '').trim().toLowerCase();
          const nameB = (b.personName || '').trim().toLowerCase();
          if (nameA && !nameB) return -1;
          if (!nameA && nameB) return 1;
          return nameA.localeCompare(nameB, 'bn');
        });

      const renderStatusBadge = (tx) => {
        if (tx.status === 'paid') return <span className="tx-category-tag" style={{ backgroundColor: 'var(--income-bg)', color: 'var(--income-color)' }}>পরিশোধিত</span>;
        if (tx.status === 'partial') return <span className="tx-category-tag" style={{ backgroundColor: 'var(--due-bg)', color: 'var(--due-color)' }}>আংশিক (বাকি: {formatBanglaCurrency(tx.pendingAmount)})</span>;
        return <span className="tx-category-tag" style={{ backgroundColor: 'var(--expense-bg)', color: 'var(--expense-color)' }}>বাকি (অপরিশোধিত)</span>;
      };

      return (
        <div className="content-area">
          <div className="summary-container">
            <div 
              className="summary-card full-width" 
              style={{ background: 'linear-gradient(135deg, #0f766e, #115e59)', cursor: 'pointer' }}
              onClick={() => onViewSubTab('all_pending')}
              title="বাকি থাকা সকল হিসাব দেখতে ক্লিক করুন"
            >
              <div>
                <div className="summary-label" style={{ display:'flex', alignItems:'center', gap:'6px' }}>মোট বকেয়া / অপরিশোধিত</div>
                <div className="summary-value">{formatBanglaCurrency(totals.totalPending)}</div>
              </div>
              <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '12px', marginTop: '12px', opacity: 0.95, borderTop:'1px solid rgba(255,255,255,0.2)', paddingTop:'8px' }}>
                <span>আমার দেনা: <strong>{formatBanglaCurrency(totals.iOwe)}</strong></span>
                <span>আমার পাওনা: <strong>{formatBanglaCurrency(totals.theyOwe)}</strong></span>
              </div>
            </div>
            
            <div 
              className="summary-card" 
              style={{ borderLeft: '4px solid var(--expense-color)', cursor: 'pointer' }}
              onClick={() => onViewSubTab('i_owe')}
              title="দেনার তালিকা দেখতে ক্লিক করুন"
            >
              <div className="summary-label">আমি পাবো না / আমার দেনা</div>
              <div className="summary-value" style={{ color: 'var(--expense-color)' }}>{formatBanglaCurrency(totals.iOwe)}</div>
            </div>
            <div 
              className="summary-card" 
              style={{ borderLeft: '4px solid var(--income-color)', cursor: 'pointer' }}
              onClick={() => onViewSubTab('they_owe')}
              title="পাওনার তালিকা দেখতে ক্লিক করুন"
            >
              <div className="summary-label">আমার পাওনা (আমি পাবো)</div>
              <div className="summary-value" style={{ color: 'var(--income-color)' }}>{formatBanglaCurrency(totals.theyOwe)}</div>
            </div>
            <div 
              className="summary-card" 
              style={{ borderLeft: '4px solid #10b981', cursor: 'pointer' }}
              onClick={() => onViewSubTab('settled')}
              title="সম্পন্ন লেনদেন দেখতে ক্লিক করুন"
            >
              <div className="summary-label">মোট পরিশোধিত</div>
              <div className="summary-value" style={{ color: '#10b981' }}>{formatBanglaCurrency(totals.totalPaid)}</div>
            </div>
            <div 
              className="summary-card" 
              style={{ borderLeft: '4px solid var(--due-color)', cursor: 'pointer' }}
              onClick={() => onViewSubTab('all_partial')}
              title="আংশিক পরিশোধিত হিসাব দেখতে ক্লিক করুন"
            >
              <div className="summary-label">আংশিক পরিশোধিত</div>
              <div className="summary-value" style={{ color: 'var(--due-color)' }}>{formatBanglaCurrency(totals.totalPartial)}</div>
            </div>
            <div className="summary-card">
              <div className="summary-label">আজকের জমা/পরিশোধ</div>
              <div className="summary-value" style={{ fontSize:'18px', color:'var(--primary)' }}>{formatBanglaCurrency(totals.todayPaid)}</div>
            </div>
            <div className="summary-card">
              <div className="summary-label">এই মাসের মোট পরিশোধ</div>
              <div className="summary-value" style={{ fontSize:'18px', color:'var(--primary)' }}>{formatBanglaCurrency(totals.monthPaid)}</div>
            </div>
          </div>

          <h2 className="section-title">ক্যাটাগরি ভিত্তিক হিসাব</h2>
          <div className="categories-grid">
            {['borrowed', 'receivable', 'expense', 'owed'].map(key => {
              const stats = getCategoryStats(key);
              let color = 'var(--primary)'; let bgClass = 'owed'; let Icon = HelpCircleIcon;
              if (key === 'borrowed') { color = 'var(--expense-color)'; bgClass = 'expense'; Icon = ArrowDownRight; }
              else if (key === 'receivable') { color = 'var(--income-color)'; bgClass = 'income'; Icon = ArrowUpRight; }
              else if (key === 'expense') { color = '#3b82f6'; bgClass = 'expense-blue'; Icon = WalletIcon; }
              else if (key === 'owed') { color = 'var(--due-color)'; bgClass = 'due'; Icon = ClockIcon; }

              return (
                <div className={`category-card ${bgClass}`} key={key} style={{ borderLeftColor: color }}>
                  <div className="category-header">
                    <div className="category-info">
                      <Icon color={color} size={22} />
                      <span className="category-title">{categories[key]}</span>
                    </div>
                    <div className="category-stats">{toBanglaDigits(stats.count)} টি হিসাব</div>
                  </div>
                  <div className="category-body">
                    <div className="category-amount" style={{ color: color }}>{formatBanglaCurrency(stats.total)}</div>
                  </div>
                  <div className="category-footer">
                    <span>সর্বশেষ: {stats.latest}</span>
                    <button type="button" className="btn-view-all" onClick={() => onViewSubTab(key)}>সব দেখুন <ArrowRight size={14}/></button>
                  </div>
                </div>
              );
            })}
          </div>

          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginTop:'24px', marginBottom:'12px' }}>
            <h2 className="section-title" style={{ margin: 0 }}>সাম্প্রতিক হিসাব</h2>
            <button type="button" className="btn-view-all" onClick={() => onViewSubTab('all')}>সব দেখুন <ArrowRight size={14}/></button>
          </div>
          <div className="transaction-list">
            {recentTransactions.length === 0 ? (
              <div style={{ textAlign:'center', color:'var(--text-muted)', padding:'20px', backgroundColor:'var(--bg-card)', borderRadius:'16px', border:'1px dashed var(--border)' }}>কোন হিসাব নেই</div>
            ) : (
              recentTransactions.map(tx => (
                <div className="transaction-card" key={tx.id} style={{ opacity: tx.status === 'paid' ? 0.85 : 1 }}>
                  <div className="transaction-meta">
                    <div className="tx-header">
                      <span className="tx-serial">{padSerial(tx.serial)}</span>
                      <span className="tx-description" style={{ textDecoration: tx.status === 'paid' ? 'line-through' : 'none' }}>{tx.description}</span>
                    </div>
                    <div className="tx-details">
                      {formatBanglaDate(tx.date)} • {formatBanglaTime(tx.time)}
                      {tx.personName && ` • 👤 ${tx.personName}`}
                    </div>
                    <div style={{ display: 'flex', gap: '6px', alignItems: 'center', marginTop: '4px', flexWrap: 'wrap' }}>
                      <span className="tx-category-tag">{categories[tx.categoryType]}</span>
                      {renderStatusBadge(tx)}
                    </div>
                  </div>
                  <div className="transaction-right">
                    <div className="tx-amount" style={{ color: tx.status === 'paid' ? '#10b981' : 'var(--text-main)' }}>
                      {formatBanglaCurrency(tx.amount)}
                    </div>
                    {tx.status === 'paid' && <CheckCircleIcon size={16} color="#10b981" style={{ marginTop: '4px' }} />}
                  </div>
                </div>
              ))
            )}
          </div>
          <button type="button" className="fab" onClick={onAddClick}><PlusIcon size={20}/> হিসাব লিখুন</button>
        </div>
      );
    }

    // 4. TRANSACTION HISTORY & SEARCH PAGE
    function TransactionHistory({ 
      transactions, 
      categories, 
      onEdit, 
      onDelete, 
      onUpdate, 
      initialSubTab, 
      initialStatusFilter, 
      initialCategoryFilter 
    }) {
      const [searchTerm, setSearchTerm] = useState('');
      const [activeSubTab, setActiveSubTab] = useState('all');
      const [activeCategoryFilter, setActiveCategoryFilter] = useState('all');
      const [activeStatusFilter, setActiveStatusFilter] = useState('all');
      const [startDate, setStartDate] = useState('');
      const [endDate, setEndDate] = useState('');
      
      const [deleteTargetId, setDeleteTargetId] = useState(null);
      const [quickPayTx, setQuickPayTx] = useState(null);
      const [quickPayMode, setQuickPayMode] = useState('full');
      const [quickPaidAmount, setQuickPaidAmount] = useState('');
      const [expandedPerson, setExpandedPerson] = useState(null);

      useEffect(() => {
        if (initialSubTab) setActiveSubTab(initialSubTab);
        else setActiveSubTab('all');

        if (initialStatusFilter) setActiveStatusFilter(initialStatusFilter);
        else setActiveStatusFilter('all');

        if (initialCategoryFilter) setActiveCategoryFilter(initialCategoryFilter);
        else setActiveCategoryFilter('all');
      }, [initialSubTab, initialStatusFilter, initialCategoryFilter]);

      const filteredList = transactions.filter(tx => {
        // Sub-Tab segmentation
        if (activeSubTab === 'i_owe') {
          const isOweType = tx.categoryType === 'borrowed' || tx.categoryType === 'owed';
          const isUnsettled = tx.status !== 'paid';
          if (!isOweType || !isUnsettled) return false;
        } else if (activeSubTab === 'they_owe') {
          const isReceivableType = tx.categoryType === 'receivable';
          const isUnsettled = tx.status !== 'paid';
          if (!isReceivableType || !isUnsettled) return false;
        } else if (activeSubTab === 'expense') {
          if (tx.categoryType !== 'expense') return false;
        } else if (activeSubTab === 'settled') {
          if (tx.status !== 'paid') return false;
        }

        if (activeCategoryFilter !== 'all' && tx.categoryType !== activeCategoryFilter) return false;
        if (activeStatusFilter !== 'all' && tx.status !== activeStatusFilter) return false;
        
        if (searchTerm.trim()) {
          const query = searchTerm.toLowerCase();
          const descMatch = tx.description.toLowerCase().includes(query);
          const personMatch = tx.personName ? tx.personName.toLowerCase().includes(query) : false;
          const amtMatch = tx.amount.toString().includes(query) || formatBanglaCurrency(tx.amount).includes(query);
          const catMatch = (categories[tx.categoryType] || '').toLowerCase().includes(query);
          const dateMatch = tx.date.includes(query) || formatBanglaDate(tx.date).toLowerCase().includes(query);
          if (!descMatch && !personMatch && !amtMatch && !catMatch && !dateMatch) return false;
        }
        if (startDate && tx.date < startDate) return false;
        if (endDate && tx.date > endDate) return false;
        return true;
      }).sort((a, b) => {
        const nameA = (a.personName || '').trim().toLowerCase();
        const nameB = (b.personName || '').trim().toLowerCase();
        if (nameA && !nameB) return -1;
        if (!nameA && nameB) return 1;
        if (nameA && nameB) {
          const nameCompare = nameA.localeCompare(nameB, 'bn');
          if (nameCompare !== 0) return nameCompare;
        }
        const dateA = a.date + 'T' + (a.time || '00:00');
        const dateB = b.date + 'T' + (b.time || '00:00');
        return dateB.localeCompare(dateA);
      });

      const getGroupedPersons = () => {
        const groups = {};

        transactions.forEach(tx => {
          if (!tx.personName || !tx.personName.trim()) return;
          const name = tx.personName.trim();
          const nameKey = name.toLowerCase();

          if (!groups[nameKey]) {
            groups[nameKey] = {
              name: name,
              receivablePending: 0,
              payablePending: 0,
              totalTransactions: 0
            };
          }

          groups[nameKey].totalTransactions += 1;
          
          const pending = tx.pendingAmount || 0;
          if (tx.categoryType === 'receivable') {
            groups[nameKey].receivablePending += pending;
          } else if (tx.categoryType === 'borrowed' || tx.categoryType === 'owed') {
            groups[nameKey].payablePending += pending;
          }
        });

        return Object.values(groups)
          .filter(p => {
            const hasDues = p.receivablePending > 0 || p.payablePending > 0;
            if (!hasDues) return false;
            
            if (searchTerm.trim()) {
              return p.name.toLowerCase().includes(searchTerm.toLowerCase());
            }
            return true;
          })
          .sort((a, b) => {
            const totalA = a.receivablePending + a.payablePending;
            const totalB = b.receivablePending + b.payablePending;
            return totalB - totalA;
          });
      };

      const personLedgerList = getGroupedPersons();

      const renderStatusBadge = (tx) => {
        if (tx.status === 'paid') return <span className="tx-category-tag" style={{ backgroundColor: 'var(--income-bg)', color: 'var(--income-color)' }}>পরিশোধিত</span>;
        if (tx.status === 'partial') return <span className="tx-category-tag" style={{ backgroundColor: 'var(--due-bg)', color: 'var(--due-color)' }}>আংশিক (বাকি: {formatBanglaCurrency(tx.pendingAmount)})</span>;
        return <span className="tx-category-tag" style={{ backgroundColor: 'var(--expense-bg)', color: 'var(--expense-color)' }}>বাকি (অপরিশোধিত)</span>;
      };

      const handleConfirmDelete = () => {
        if (deleteTargetId) {
          onDelete(deleteTargetId);
          setDeleteTargetId(null);
        }
      };

      const openQuickPay = (tx) => {
        setQuickPayTx(tx);
        setQuickPayMode('full');
        setQuickPaidAmount(tx.pendingAmount ? tx.pendingAmount.toString() : '');
      };

      const handleQuickPaySubmit = (e) => {
        e.preventDefault();
        if (!quickPayTx) return;

        let updatedTx = { ...quickPayTx };
        if (quickPayMode === 'full') {
          updatedTx.status = 'paid';
          updatedTx.paidAmount = quickPayTx.amount;
          updatedTx.pendingAmount = 0;
        } else {
          const additionalPaid = parseBanglaFloat(quickPaidAmount);
          if (isNaN(additionalPaid) || additionalPaid <= 0) { alert('সঠিক টাকা লিখুন!'); return; }
          const totalPaid = (quickPayTx.paidAmount || 0) + additionalPaid;
          if (totalPaid > quickPayTx.amount) { alert('পরিশোধ মোট হিসাবের চেয়ে বেশি হতে পারে না!'); return; }
          
          updatedTx.paidAmount = totalPaid;
          updatedTx.pendingAmount = quickPayTx.amount - totalPaid;
          updatedTx.status = updatedTx.pendingAmount === 0 ? 'paid' : 'partial';
        }

        onUpdate(updatedTx);
        setQuickPayTx(null);
        alert('সফলভাবে পরিশোধ তথ্য আপডেট করা হয়েছে!');
      };

      return (
        <div className="content-area">
          {/* Horizontal Sub Tabs */}
          <div style={{ display: 'flex', gap: '8px', overflowX: 'auto', marginBottom: '16px', borderBottom: '1px solid var(--border)', paddingBottom: '10px' }}>
            <button
              type="button"
              className={`filter-chip ${activeSubTab === 'i_owe' ? 'active' : ''}`}
              style={{ borderRadius: '10px', padding: '8px 16px', flex: '1 0 auto', textAlign: 'center' }}
              onClick={() => {
                setActiveSubTab('i_owe');
                setActiveCategoryFilter('all');
                setActiveStatusFilter('all');
              }}
            >
              আমার দেনা (আমি দেবো)
            </button>
            <button
              type="button"
              className={`filter-chip ${activeSubTab === 'they_owe' ? 'active' : ''}`}
              style={{ borderRadius: '10px', padding: '8px 16px', flex: '1 0 auto', textAlign: 'center' }}
              onClick={() => {
                setActiveSubTab('they_owe');
                setActiveCategoryFilter('all');
                setActiveStatusFilter('all');
              }}
            >
              আমার পাওনা (অন্যরা দেবে)
            </button>
            <button
              type="button"
              className={`filter-chip ${activeSubTab === 'expense' ? 'active' : ''}`}
              style={{ borderRadius: '10px', padding: '8px 16px', flex: '1 0 auto', textAlign: 'center' }}
              onClick={() => {
                setActiveSubTab('expense');
                setActiveCategoryFilter('all');
                setActiveStatusFilter('all');
              }}
            >
              ক্রয় / খরচ
            </button>
            <button
              type="button"
              className={`filter-chip ${activeSubTab === 'settled' ? 'active' : ''}`}
              style={{ borderRadius: '10px', padding: '8px 16px', flex: '1 0 auto', textAlign: 'center' }}
              onClick={() => {
                setActiveSubTab('settled');
                setActiveCategoryFilter('all');
                setActiveStatusFilter('all');
              }}
            >
              পরিশোধিত (সম্পন্ন)
            </button>
            <button
              type="button"
              className={`filter-chip ${activeSubTab === 'person_ledger' ? 'active' : ''}`}
              style={{ borderRadius: '10px', padding: '8px 16px', flex: '1 0 auto', textAlign: 'center' }}
              onClick={() => {
                setActiveSubTab('person_ledger');
                setActiveCategoryFilter('all');
                setActiveStatusFilter('all');
              }}
            >
              ব্যক্তিভিত্তিক হিসাব
            </button>
            <button
              type="button"
              className={`filter-chip ${activeSubTab === 'all' ? 'active' : ''}`}
              style={{ borderRadius: '10px', padding: '8px 16px', flex: '1 0 auto', textAlign: 'center' }}
              onClick={() => {
                setActiveSubTab('all');
                setActiveCategoryFilter('all');
                setActiveStatusFilter('all');
              }}
            >
              সব হিসাব
            </button>
          </div>

          <div className="history-controls">
            <div className="search-box">
              <SearchIcon size={18} className="search-icon" />
              <input 
                type="text" 
                className="search-input" 
                placeholder={activeSubTab === 'person_ledger' ? "ব্যক্তির নাম দিয়ে খুঁজুন..." : "হিসাব খুঁজুন (বিবরণ, টাকা, ব্যক্তি, তারিখ)..."} 
                value={searchTerm} 
                onChange={(e) => setSearchTerm(e.target.value)} 
              />
            </div>
            
            {activeSubTab === 'all' && (
              <>
                <div className="filters-row">
                  <button type="button" className={`filter-chip ${activeCategoryFilter==='all'?'active':''}`} onClick={() => setActiveCategoryFilter('all')}>সব ক্যাটাগরি</button>
                  <button type="button" className={`filter-chip ${activeCategoryFilter==='borrowed'?'active':''}`} onClick={() => setActiveCategoryFilter('borrowed')}>{categories.borrowed}</button>
                  <button type="button" className={`filter-chip ${activeCategoryFilter==='receivable'?'active':''}`} onClick={() => setActiveCategoryFilter('receivable')}>{categories.receivable}</button>
                  <button type="button" className={`filter-chip ${activeCategoryFilter==='expense'?'active':''}`} onClick={() => setActiveCategoryFilter('expense')}>{categories.expense}</button>
                  <button type="button" className={`filter-chip ${activeCategoryFilter==='owed'?'active':''}`} onClick={() => setActiveCategoryFilter('owed')}>{categories.owed}</button>
                </div>

                <div className="filters-row" style={{ marginTop: '2px', borderTop: '1px solid #f1f5f9', paddingTop: '8px' }}>
                  <button type="button" className={`filter-chip ${activeStatusFilter==='all'?'active':''}`} onClick={() => setActiveStatusFilter('all')}>সব স্ট্যাটাস</button>
                  <button type="button" className={`filter-chip ${activeStatusFilter==='pending'?'active':''}`} style={{ color:'var(--expense-color)' }} onClick={() => setActiveStatusFilter('pending')}>বাকি (অপরিশোধিত)</button>
                  <button type="button" className={`filter-chip ${activeStatusFilter==='partial'?'active':''}`} style={{ color:'var(--due-color)' }} onClick={() => setActiveStatusFilter('partial')}>আংশিক পরিশোধিত</button>
                  <button type="button" className={`filter-chip ${activeStatusFilter==='paid'?'active':''}`} style={{ color:'var(--income-color)' }} onClick={() => setActiveStatusFilter('paid')}>পরিশোধিত</button>
                </div>
              </>
            )}

            {activeSubTab !== 'person_ledger' && (
              <div className="date-filter-group">
                <div className="date-input-wrapper"><label>শুরুর তারিখ</label><input type="date" value={startDate} onChange={(e) => setStartDate(e.target.value)}/></div>
                <div className="date-input-wrapper"><label>শেষ তারিখ</label><input type="date" value={endDate} onChange={(e) => setEndDate(e.target.value)}/></div>
              </div>
            )}
            {(startDate || endDate || searchTerm || activeCategoryFilter !== 'all' || activeStatusFilter !== 'all' || activeSubTab !== 'all') && (
              <button type="button" className="settings-action" style={{ fontSize:'12px', alignSelf:'flex-end', marginTop: '-4px' }} onClick={() => { setStartDate(''); setEndDate(''); setSearchTerm(''); setActiveCategoryFilter('all'); setActiveStatusFilter('all'); setActiveSubTab('all'); }}>ফিল্টার রিসেট</button>
            )}
          </div>

          <div className="transaction-list" style={{ paddingBottom:'30px' }}>
            <div style={{ display:'flex', justifyContent:'space-between', fontSize:'13px', color:'var(--text-muted)', marginBottom:'4px', fontWeight:500 }}>
              <span>
                ফলাফল: {toBanglaDigits(activeSubTab === 'person_ledger' ? personLedgerList.length : filteredList.length)} টি {activeSubTab === 'person_ledger' ? 'ব্যক্তি' : 'হিসাব'}
              </span>
            </div>
            
            {activeSubTab === 'person_ledger' ? (
              personLedgerList.length === 0 ? (
                <div style={{ textAlign:'center', color:'var(--text-muted)', padding:'40px 20px', backgroundColor:'var(--bg-card)', borderRadius:'16px', border:'1px dashed var(--border)' }}>বকেয়া বর্গের কোনো ব্যক্তি পাওয়া যায়নি</div>
              ) : (
                personLedgerList.map(p => {
                  const netBalance = p.receivablePending - p.payablePending;
                  const firstLetter = p.name ? p.name.charAt(0).toUpperCase() : '👤';
                  
                  return (
                    <div 
                      className="transaction-card" 
                      key={p.name.toLowerCase()}
                      style={{ 
                        borderLeft: netBalance > 0 ? '5px solid var(--income-color)' : netBalance < 0 ? '5px solid var(--expense-color)' : '5px solid var(--border)',
                        padding: '16px',
                        display: 'flex',
                        flexDirection: 'column',
                        gap: '12px'
                      }}
                    >
                      <div 
                        style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', cursor: 'pointer' }}
                        onClick={() => setExpandedPerson(expandedPerson === p.name.toLowerCase() ? null : p.name.toLowerCase())}
                      >
                        <div style={{ display: 'flex', alignItems: 'center', gap: '12px' }}>
                          <div style={{ 
                            width: '40px', 
                            height: '40px', 
                            borderRadius: '50%', 
                            backgroundColor: netBalance > 0 ? 'var(--income-bg)' : netBalance < 0 ? 'var(--expense-bg)' : 'var(--bg-input)', 
                            color: netBalance > 0 ? 'var(--income-color)' : netBalance < 0 ? 'var(--expense-color)' : 'var(--text-muted)', 
                            display: 'flex', 
                            alignItems: 'center', 
                            justifyContent: 'center', 
                            fontWeight: 'bold',
                            fontSize: '18px'
                          }}>
                            {firstLetter}
                          </div>
                          <div>
                            <div style={{ fontWeight: '700', fontSize: '17px', color: 'var(--text-main)', display: 'flex', alignItems: 'center', gap: '6px' }}>
                              {p.name}
                              {expandedPerson === p.name.toLowerCase() ? <ChevronUpIcon size={16} color="var(--text-muted)" /> : <ChevronDownIcon size={16} color="var(--text-muted)" />}
                            </div>
                            <div style={{ fontSize: '12px', color: 'var(--text-muted)' }}>মোট হিসাব এন্ট্রি: {toBanglaDigits(p.totalTransactions)} টি (বিস্তারিত দেখতে ট্যাপ করুন)</div>
                          </div>
                        </div>
                        
                        <button 
                          type="button" 
                          className="btn btn-secondary" 
                          style={{ fontSize: '12px', padding: '6px 12px', borderRadius: '8px', height: 'auto', flex: 'none' }}
                          onClick={(e) => {
                            e.stopPropagation();
                            setSearchTerm(p.name);
                            setActiveSubTab('all');
                          }}
                        >
                          হিসাব দেখুন
                        </button>
                      </div>
                      
                      <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: '13px', backgroundColor: 'var(--bg-main)', padding: '10px 12px', borderRadius: '10px', flexWrap: 'wrap', gap: '8px' }}>
                        {p.receivablePending > 0 && (
                          <div>
                            <span style={{ color: 'var(--text-muted)' }}>আমি পাবো: </span>
                            <strong style={{ color: 'var(--income-color)' }}>{formatBanglaCurrency(p.receivablePending)}</strong>
                          </div>
                        )}
                        {p.payablePending > 0 && (
                          <div>
                            <span style={{ color: 'var(--text-muted)' }}>আমি দেবো (দেনা): </span>
                            <strong style={{ color: 'var(--expense-color)' }}>{formatBanglaCurrency(p.payablePending)}</strong>
                          </div>
                        )}
                        
                        <div style={{ width: '100%', borderTop: '1px dashed var(--border)', margin: '4px 0' }}></div>
                        
                        <div style={{ display: 'flex', justifyContent: 'space-between', width: '100%', alignItems: 'center' }}>
                          <span style={{ fontWeight: '500' }}>অবशिष्ट নেট ব্যালেন্স:</span>
                          {netBalance > 0 ? (
                            <span className="tx-category-tag" style={{ backgroundColor: 'var(--income-bg)', color: 'var(--income-color)', margin: 0, fontSize: '12px', fontWeight: 'bold' }}>
                              নেট পাওনা: {formatBanglaCurrency(netBalance)}
                            </span>
                          ) : netBalance < 0 ? (
                            <span className="tx-category-tag" style={{ backgroundColor: 'var(--expense-bg)', color: 'var(--expense-color)', margin: 0, fontSize: '12px', fontWeight: 'bold' }}>
                              নেট দেনা: {formatBanglaCurrency(Math.abs(netBalance))}
                            </span>
                          ) : (
                            <span className="tx-category-tag" style={{ backgroundColor: 'var(--bg-input)', color: 'var(--text-muted)', margin: 0, fontSize: '12px' }}>
                              সমতা
                            </span>
                          )}
                        </div>
                      </div>

                      {/* Expanded Transactions list of this person */}
                      {expandedPerson === p.name.toLowerCase() && (
                        <div style={{ marginTop: '12px', borderTop: '1px solid var(--border)', paddingTop: '12px' }}>
                          <div style={{ fontWeight: '600', fontSize: '14px', marginBottom: '8px', color: 'var(--text-muted)' }}>লেনদেনের বিবরণী:</div>
                          <div style={{ display: 'flex', flexDirection: 'column', gap: '8px' }}>
                            {transactions
                              .filter(tx => tx.personName && tx.personName.trim().toLowerCase() === p.name.toLowerCase() && tx.status !== 'paid')
                              .sort((a, b) => {
                                const dateA = a.date + 'T' + (a.time || '00:00');
                                const dateB = b.date + 'T' + (b.time || '00:00');
                                return dateB.localeCompare(dateA);
                              })
                              .map(tx => (
                                <div key={tx.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', backgroundColor: '#ffffff', border: '1px solid var(--border)', borderRadius: '8px', padding: '10px 12px' }}>
                                  <div style={{ display: 'flex', flexDirection: 'column', gap: '2px' }}>
                                    <div style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                                      <span style={{ fontSize: '11px', fontWeight: '700', color: 'var(--text-muted)', backgroundColor: 'var(--bg-input)', padding: '1px 5px', borderRadius: '4px' }}>
                                        {toBanglaDigits(tx.serial.toString().padStart(3, '0'))}
                                      </span>
                                      <span style={{ fontWeight: '600', fontSize: '14px', textDecoration: tx.status === 'paid' ? 'line-through' : 'none' }}>
                                        {tx.description}
                                      </span>
                                    </div>
                                    <div style={{ fontSize: '11px', color: 'var(--text-muted)' }}>
                                      {formatBanglaDate(tx.date)} • {formatBanglaTime(tx.time)}
                                    </div>
                                    <div style={{ display: 'flex', gap: '4px', marginTop: '2px' }}>
                                      <span className="tx-category-tag" style={{ border: '1px solid var(--border)', fontSize: '10px', padding: '1px 6px', margin: 0 }}>
                                        {categories[tx.categoryType]}
                                      </span>
                                      <span className="tx-category-tag" style={{ 
                                        backgroundColor: tx.status === 'paid' ? 'var(--income-bg)' : tx.status === 'partial' ? 'var(--due-bg)' : 'var(--expense-bg)', 
                                        color: tx.status === 'paid' ? 'var(--income-color)' : tx.status === 'partial' ? 'var(--due-color)' : 'var(--expense-color)',
                                        fontSize: '10px', 
                                        padding: '1px 6px', 
                                        margin: 0 
                                      }}>
                                        {tx.status === 'paid' ? 'পরিশোধিত' : tx.status === 'partial' ? `আংশিক (বাকি: ${formatBanglaCurrency(tx.pendingAmount)})` : 'বাকি (অপরিশোধিত)'}
                                      </span>
                                    </div>
                                  </div>
                                  <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-end', gap: '4px' }}>
                                    <span style={{ fontWeight: '700', fontSize: '15px', color: tx.status === 'paid' ? 'var(--income-color)' : 'var(--text-main)' }}>
                                      {formatBanglaCurrency(tx.amount)}
                                    </span>
                                    <div style={{ display: 'flex', gap: '4px' }}>
                                      <button type="button" className="icon-button" style={{ padding: '2px' }} title="সংশোধন" onClick={(e) => { e.stopPropagation(); onEdit(tx); }}>
                                        <EditIcon size={14} />
                                      </button>
                                      <button type="button" className="icon-button" style={{ color: 'var(--expense-color)', padding: '2px' }} title="মুছুন" onClick={(e) => { e.stopPropagation(); setDeleteTargetId(tx.id); }}>
                                        <TrashIcon size={14} />
                                      </button>
                                    </div>
                                  </div>
                                </div>
                              ))}
                          </div>
                        </div>
                      )}
                    </div>
                  );
                })
              )
            ) : (
              filteredList.length === 0 ? (
                <div style={{ textAlign:'center', color:'var(--text-muted)', padding:'40px 20px', backgroundColor:'var(--bg-card)', borderRadius:'16px', border:'1px dashed var(--border)' }}>কোন হিসাব পাওয়া যায়নি</div>
              ) : (
                filteredList.map(tx => (
                  <div 
                    className="transaction-card" 
                    key={tx.id}
                    style={{ 
                      opacity: tx.status === 'paid' ? 0.75 : 1,
                      borderLeft: tx.status === 'paid' ? '5px solid var(--income-color)' : tx.status === 'partial' ? '5px solid var(--due-color)' : '5px solid var(--expense-color)'
                    }}
                  >
                    <div className="transaction-meta">
                      <div className="tx-header">
                        <span className="tx-serial">{padSerial(tx.serial)}</span>
                        <span className="tx-description" style={{ textDecoration: tx.status === 'paid' ? 'line-through' : 'none' }}>{tx.description}</span>
                      </div>
                      <div className="tx-details">
                        {formatBanglaDate(tx.date)} • {formatBanglaTime(tx.time)}
                        {tx.personName && ` • 👤 ${tx.personName}`}
                      </div>
                      {tx.note && <div style={{ fontSize:'12px', color:'var(--text-muted)', fontStyle:'italic', marginTop:'2px' }}>নোট: {tx.note}</div>}
                      <div style={{ display: 'flex', gap: '6px', alignItems: 'center', marginTop: '4px', flexWrap:'wrap' }}>

    // 5. FULL-PAGE CALCULATOR TAB
    function CalculatorTab({ onAddWithAmount }) {
      const [display, setDisplay] = useState('0');
      const [formula, setFormula] = useState('');
      const [isDone, setIsDone] = useState(false);

      const handleDigit = (digit) => {
        if (isDone) { setDisplay(digit); setFormula(''); setIsDone(false); return; }
        if (display === '0') setDisplay(digit);
        else setDisplay(display + digit);
      };

      const handleDecimal = () => {
        if (isDone) { setDisplay('0.'); setFormula(''); setIsDone(false); return; }
        const parts = display.split(/[+\-*/]/);
        const lastPart = parts[parts.length - 1];
        if (!lastPart.includes('.')) setDisplay(display + '.');
      };

      const handleOperator = (op) => {
        setIsDone(false);
        const lastChar = display[display.length - 1];
        if (['+', '-', '*', '/'].includes(lastChar)) {
          setDisplay(display.slice(0, -1) + op);
        } else {
          setDisplay(display + op);
        }
      };

      const handlePercent = () => {
        const parts = display.split(/[+\-*/]/);
        const lastPart = parts[parts.length - 1];
        if (!lastPart || lastPart === '0') return;
        const value = parseFloat(lastPart) / 100;
        const beforePart = display.slice(0, display.length - lastPart.length);
        setDisplay(beforePart + value.toString());
      };

      const handleClear = () => { setDisplay('0'); setFormula(''); setIsDone(false); };
      
      const handleBackspace = () => {
        if (isDone) { handleClear(); return; }
        if (display.length > 1) setDisplay(display.slice(0, -1));
        else setDisplay('0');
      };

      const handleCalculate = () => {
        if (isDone) return;
        let expr = display;
        const lastChar = expr[expr.length - 1];
        if (['+', '-', '*', '/'].includes(lastChar)) expr = expr.slice(0, -1);
        try {
          const result = evaluateExpression(expr);
          const roundedResult = Math.round(result * 10000) / 10000;
          setFormula(expr + '=');
          setDisplay(roundedResult.toString());
          setIsDone(true);
        } catch {
          setDisplay('Error');
          setIsDone(true);
        }
      };

      const evaluateExpression = (expr) => {
        const tokens = [];
        let numberBuffer = '';
        for (let i = 0; i < expr.length; i++) {
          const char = expr[i];
          if (/[0-9.]/.test(char)) numberBuffer += char;
          else if (['+', '-', '*', '/'].includes(char)) {
            if (numberBuffer) { tokens.push(parseFloat(numberBuffer)); numberBuffer = ''; }
            tokens.push(char);
          }
        }
        if (numberBuffer) tokens.push(parseFloat(numberBuffer));
        if (tokens.length === 0) return 0;

        const firstPass = [];
        let i = 0;
        while (i < tokens.length) {
          const token = tokens[i];
          if (token === '*' || token === '/') {
            const prev = firstPass.pop();
            const next = tokens[i + 1];
            if (prev === undefined || next === undefined) throw new Error();
            const val = token === '*' ? prev * next : prev / next;
            firstPass.push(val);
            i += 2;
          } else {
            firstPass.push(token);
            i++;
          }
        }

        let result = firstPass[0];
        let j = 1;
        while (j < firstPass.length) {
          const op = firstPass[j];
          const val = firstPass[j + 1];
          if (op === '+') result += val;
          else if (op === '-') result -= val;
          j += 2;
        }
        return result;
      };

      const handleCreateTransaction = () => {
        let finalVal = display;
        if (/[+\-*/]/.test(display) && !isDone) {
          let expr = display;
          const lastChar = expr[expr.length - 1];
          if (['+', '-', '*', '/'].includes(lastChar)) expr = expr.slice(0, -1);
          try {
            const res = evaluateExpression(expr);
            finalVal = (Math.round(res * 100) / 100).toString();
          } catch {
            finalVal = '0';
          }
        }
        const numericVal = parseFloat(finalVal);
        onAddWithAmount(isNaN(numericVal) ? 0 : numericVal);
      };

      return (
        <div className="content-area" style={{ display:'flex', flexDirection:'column', justifyContent:'center', paddingBottom:'30px' }}>
          <h2 className="section-title" style={{ marginTop:0, textAlign:'center' }}>ক্যালকুলেটর</h2>
          <div style={{ maxWidth:'360px', width:'100%', margin:'0 auto' }}>
            <div className="calc-display" style={{ minHeight:'80px', marginBottom:'16px' }}>
              {formula && <div className="calc-formula">{toBanglaDigits(formula)}</div>}
              <div>{toBanglaDigits(display)}</div>
            </div>
            <div className="calculator-grid">
              <button type="button" className="calc-btn op" onClick={handleClear}>C</button>
              <button type="button" className="calc-btn op" onClick={handleBackspace}><BackspaceIcon size={20}/></button>
              <button type="button" className="calc-btn op" onClick={handlePercent}>%</button>
              <button type="button" className="calc-btn op" onClick={() => handleOperator('/')}>÷</button>
              <button type="button" className="calc-btn" onClick={() => handleDigit('7')}>7</button>
              <button type="button" className="calc-btn" onClick={() => handleDigit('8')}>8</button>
              <button type="button" className="calc-btn" onClick={() => handleDigit('9')}>9</button>
              <button type="button" className="calc-btn op" onClick={() => handleOperator('*')}>×</button>
              <button type="button" className="calc-btn" onClick={() => handleDigit('4')}>4</button>
              <button type="button" className="calc-btn" onClick={() => handleDigit('5')}>5</button>
              <button type="button" className="calc-btn" onClick={() => handleDigit('6')}>6</button>
              <button type="button" className="calc-btn op" onClick={() => handleOperator('-')}>-</button>
              <button type="button" className="calc-btn" onClick={() => handleDigit('1')}>1</button>
              <button type="button" className="calc-btn" onClick={() => handleDigit('2')}>2</button>
              <button type="button" className="calc-btn" onClick={() => handleDigit('3')}>3</button>
              <button type="button" className="calc-btn op" onClick={() => handleOperator('+')}>+</button>
              <button type="button" className="calc-btn" style={{ gridColumn:'span 2' }} onClick={() => handleDigit('0')}>0</button>
              <button type="button" className="calc-btn" onClick={handleDecimal}>.</button>
              <button type="button" className="calc-btn eq" onClick={handleCalculate}>=</button>
            </div>
            <button type="button" className="btn btn-primary" style={{ width:'100%', marginTop:'20px', display:'flex', alignItems:'center', justifyContent:'center', gap:'8px' }} onClick={handleCreateTransaction}>
              <PlusIcon size={20} /> হিসাব খাতায় লিখুন
            </button>
          </div>
        </div>
      );
    }

    // 6. STATISTICS & REPORTS PAGE
    function Report({ transactions, categories }) {
      const getStats = () => {
        let totalBorrowed = 0; let totalReceivable = 0; let totalExpense = 0; let totalOwed = 0;
        let countBorrowed = 0; let countReceivable = 0; let countExpense = 0; let countOwed = 0;
        let totalPaid = 0; let totalPending = 0;
        let countPaid = 0; let countPartial = 0; let countPending = 0;

        transactions.forEach(tx => {
          const amt = tx.amount;
          const paid = tx.paidAmount || 0;
          const pending = tx.pendingAmount || 0;
          const type = tx.categoryType;
          const status = tx.status || 'paid';

          if (type === 'borrowed') { totalBorrowed += amt; countBorrowed++; }
          else if (type === 'receivable') { totalReceivable += amt; countReceivable++; }
          else if (type === 'expense') { totalExpense += amt; countExpense++; }
          else if (type === 'owed') { totalOwed += amt; countOwed++; }

          totalPaid += paid;
          totalPending += pending;

          if (status === 'paid') countPaid++;
          else if (status === 'partial') countPartial++;
          else countPending++;
        });

        const totalVolume = totalBorrowed + totalReceivable + totalExpense + totalOwed;
        const countTotal = transactions.length;
        const averageTx = countTotal > 0 ? (totalVolume / countTotal) : 0;
        const borrowedPercent = totalVolume > 0 ? Math.round((totalBorrowed / totalVolume) * 100) : 0;
        const receivablePercent = totalVolume > 0 ? Math.round((totalReceivable / totalVolume) * 100) : 0;
        const expensePercent = totalVolume > 0 ? Math.round((totalExpense / totalVolume) * 100) : 0;
        const owedPercent = totalVolume > 0 ? Math.round((totalOwed / totalVolume) * 100) : 0;
        const settledRatioPercent = totalVolume > 0 ? Math.round((totalPaid / totalVolume) * 100) : 0;

        return { totalBorrowed, totalReceivable, totalExpense, totalOwed, countBorrowed, countReceivable, countExpense, countOwed, totalPaid, totalPending, countPaid, countPartial, countPending, countTotal, averageTx, borrowedPercent, receivablePercent, expensePercent, owedPercent, settledRatioPercent };
      };

      const stats = getStats();
      const radius = 50;
      const circumference = 2 * Math.PI * radius;
      const strokeDashoffset = circumference - (stats.settledRatioPercent / 100) * circumference;

      return (
        <div className="content-area" style={{ paddingBottom:'40px' }}>

              <div style={{ padding:'10px', backgroundColor:'#ecfdf5', borderRadius:'12px', color:'#10b981' }}><CheckCircleIcon size={24}/></div>
            </div>
            <div className="summary-card" style={{ borderLeft:'4px solid var(--expense-color)', minHeight:'80px', display:'flex', flexDirection:'row', alignItems:'center', justifyContent:'space-between' }}>
              <div><div className="summary-label">মোট বকেয়া / অপরিশোধিত</div><div className="summary-value" style={{ color:'var(--expense-color)' }}>{formatBanglaCurrency(stats.totalPending)}</div></div>
              <div style={{ padding:'10px', backgroundColor:'var(--expense-bg)', borderRadius:'12px', color:'var(--expense-color)' }}><TrendingDown size={24}/></div>
            </div>
          </div>

          <div className="stats-bar-container" style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:'16px', marginBottom:'20px', padding:'24px 16px' }}>
            <span style={{ fontSize:'15px', fontWeight:'700' }}>মোট পরিশোধ বনাম বকেয়া অনুপাত</span>
            <div style={{ position:'relative', width:'130px', height:'130px' }}>
              <svg width="130" height="130" viewBox="0 0 120 120" style={{ transform:'rotate(-90deg)' }}>
                <circle cx="60" cy="60" r={radius} fill="transparent" stroke="var(--bg-input)" strokeWidth="10" />
                <circle cx="60" cy="60" r={radius} fill="transparent" stroke="#10b981" strokeWidth="10" strokeDasharray={circumference} strokeDashoffset={strokeDashoffset} strokeLinecap="round" />
              </svg>
              <div style={{ position:'absolute', top:0, left:0, width:'100%', height:'100%', display:'flex', flexDirection:'column', justifyContent:'center', alignItems:'center' }}>
                <span style={{ fontSize:'22px', fontWeight:'700' }}>{toBanglaDigits(stats.settledRatioPercent)}%</span>
                <span style={{ fontSize:'10px', color:'var(--text-muted)' }}>পরিশোধিত</span>
              </div>
            </div>
            <p style={{ fontSize:'13px', color:'var(--text-muted)', textAlign:'center' }}>আপনার মোট হিসাবের {toBanglaDigits(stats.settledRatioPercent)}% টাকা লেনদেন পরিশোধ হয়েছে।</p>
          </div>

          <div className="stats-bar-container" style={{ marginBottom:'20px' }}>
            <div className="stats-bar-title"><span>ক্যাটাগরি ভিত্তিক হিসাব অনুপাত</span><span>শতকরা (%)</span></div>
            <div style={{ display:'flex', flexDirection:'column', gap:'16px', marginTop:'12px' }}>

                const col = key === 'borrowed' ? 'var(--expense-color)' : key === 'receivable' ? 'var(--income-color)' : key === 'expense' ? '#3b82f6' : 'var(--due-color)';

                <span style={{ color:'var(--text-muted)' }}>মোট হিসাব এন্ট্রি:</span><span style={{ fontWeight:600 }}>{toBanglaDigits(stats.countTotal)} টি</span>
              </div>
              <div style={{ display:'flex', justifyContent:'space-between', fontSize:'14px', borderBottom:'1px solid #f1f5f9', paddingBottom:'8px' }}>

              </div>
              <div style={{ display:'flex', justifyContent:'space-between', fontSize:'14px', borderBottom:'1px solid #f1f5f9', paddingBottom:'8px' }}>
