    // 7. SETTINGS, BACKUP, & CREDIT SCREEN
    function Settings({ categories, onRestoreSuccess, onClearAllData, currentUser, onLogout, onProfileUpdate }) {
      const [isClearConfirmOpen, setIsClearConfirmOpen] = useState(false);
      
      const [oldPin, setOldPin] = useState('');
      const [newPin, setNewPin] = useState('');
      const [confirmNewPin, setConfirmNewPin] = useState('');

      const exportBackup = () => {
        const backup = {
          app: 'Hisaber Khata',
          version: '1.0.0',
          exportedAt: new Date().toISOString(),
          username: currentUser.username,
          name: currentUser.name,
          data: {
            categories,
            transactions: getStoredTransactions(currentUser.username)
          }
        };
        const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `hisaber_khata_backup_${currentUser.username}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      const handleFileChange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            if (parsed.app !== 'Hisaber Khata' || !parsed.data) throw new Error();
            saveStoredTransactions(parsed.data.transactions, currentUser.username);
            saveStoredCategories(parsed.data.categories, currentUser.username);
            onRestoreSuccess(parsed.data.transactions, parsed.data.categories);
            alert('ডাটা সফলভাবে রিস্টোর করা হয়েছে!');
          } catch (e) {
            alert('ভুল ফাইল! অনুগ্রহ করে সঠিক হিসাবের খাতা ব্যাকআপ ফাইল সিলেক্ট করুন।');
          }
        };
        reader.readAsText(file);
      };

      const handleClear = () => {
        clearAllAppData(currentUser.username);
        onClearAllData();
        setIsClearConfirmOpen(false);
        alert('আপনার প্রোফাইলের সমস্ত ডাটা সফলভাবে মুছে ফেলা হয়েছে!');
      };

      const handlePinChange = (e) => {
        e.preventDefault();
        if (oldPin !== currentUser.pin) {
          alert('আপনার বর্তমান পিন কোডটি ভুল!');
          return;
        }
        if (newPin.length !== 4) {
          alert('নতুন পিন অবশ্যই ৪ সংখ্যার হতে হবে!');
          return;
        }
        if (newPin !== confirmNewPin) {
          alert('নতুন পিন কোড দুটি মেলেনি!');
          return;
        }
        
        const usersList = getStoredUsers();
        const updatedUsers = usersList.map(u => {
          if (u.username === currentUser.username) {
            return { ...u, pin: newPin };
          }
          return u;
        });
        saveStoredUsers(updatedUsers);
        onProfileUpdate({ ...currentUser, pin: newPin });
        
        setOldPin('');
        setNewPin('');
        setConfirmNewPin('');
        alert('আপনার পিন কোড সফলভাবে পরিবর্তন করা হয়েছে!');
      };

      return (
        <div className="content-area" style={{ paddingBottom:'40px' }}>
          <h2 className="section-title" style={{ marginTop:0 }}>সেটিংস</h2>
          <div className="settings-list">
            
            <div className="settings-section">
              <div className="settings-section-title">প্রোফাইল ও নিরাপত্তা</div>
              
              <div className="settings-row" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                <div className="settings-info">
                  <span className="settings-label" style={{ fontWeight: 'bold', fontSize: '16px' }}>👤 {currentUser.name}</span>
                  <span className="settings-desc">ইউজারনেম: @{currentUser.username}</span>
                </div>
                <button 
                  type="button" 
                  className="settings-action" 
                  onClick={onLogout}
                  style={{ display: 'flex', alignItems: 'center', gap: '6px', backgroundColor: 'var(--expense-bg)', color: 'var(--expense-color)', border: 'none' }}
                >
                  <LockIcon size={16} /> লগআউট করুন
                </button>
              </div>

              <div style={{ borderTop: '1px dashed var(--border)', paddingTop: '12px', marginTop: '12px' }}>
                <span className="settings-label" style={{ marginBottom: '8px', display: 'block', fontSize: '13px' }}>পিন কোড পরিবর্তন করুন</span>
                <form onSubmit={handlePinChange} style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
                  <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: '8px' }}>
                    <input 
                      type="password" 
                      maxLength="4" 
                      pattern="[0-9]*"
                      inputMode="numeric"
                      placeholder="বর্তমান পিন" 
                      value={oldPin} 
                      onChange={e => setOldPin(e.target.value.replace(/[^0-9]/g, ''))}
                      className="form-input" 
                      style={{ fontSize: '13px', padding: '8px 12px', textAlign: 'center' }}
                      required
                    />
                    <input 
                      type="password" 
                      maxLength="4" 
                      pattern="[0-9]*"
                      inputMode="numeric"
                      placeholder="নতুন পিন" 
                      value={newPin} 
                      onChange={e => setNewPin(e.target.value.replace(/[^0-9]/g, ''))}
                      className="form-input" 
                      style={{ fontSize: '13px', padding: '8px 12px', textAlign: 'center' }}
                      required
                    />
                    <input 
                      type="password" 
                      maxLength="4" 
                      pattern="[0-9]*"
                      inputMode="numeric"
                      placeholder="পিন নিশ্চিত করুন" 
                      value={confirmNewPin} 
                      onChange={e => setConfirmNewPin(e.target.value.replace(/[^0-9]/g, ''))}
                      className="form-input" 
                      style={{ fontSize: '13px', padding: '8px 12px', textAlign: 'center' }}
                      required
                    />
                  </div>
                  <button 
                    type="submit" 
                    className="btn btn-primary" 
                    style={{ fontSize: '13px', padding: '8px 16px', borderRadius: '8px', width: 'auto', alignSelf: 'flex-end', height: 'auto' }}
                  >
                    পিন কোড আপডেট করুন
                  </button>
                </form>
              </div>
            </div>

            <div className="settings-section">
              <div className="settings-section-title">ক্যাটাগরি ব্যবস্থাপনা (নির্ধারিত)</div>
              <div>
                <div className="settings-row"><div className="settings-info"><span className="settings-label">আমি ধার নিয়েছি (Money I Borrow)</span><span className="settings-desc">{categories.borrowed}</span></div></div>
                <div className="settings-row"><div className="settings-info"><span className="settings-label">আমি পাবো (Money I Receive)</span><span className="settings-desc">{categories.receivable}</span></div></div>
                <div className="settings-row"><div className="settings-info"><span className="settings-label">ক্রয় / খরচ (Expenses)</span><span className="settings-desc">{categories.expense}</span></div></div>
                <div className="settings-row"><div className="settings-info"><span className="settings-label">বাকি / বকেয়া (Owed / Due)</span><span className="settings-desc">{categories.owed}</span></div></div>
              </div>
            </div>

            <div className="settings-section">
              <div className="settings-section-title">ডাটা ব্যাকআপ ও রিস্টোর</div>
              <div className="settings-row">
                <div className="settings-info" style={{ marginRight:'16px' }}><span className="settings-label">ব্যাকআপ ফাইল ডাউনলোড</span><span className="settings-desc">হিসাবসমূহ অফলাইনে ফাইল আকারে ডাউনলোড করুন।</span></div>
                <button type="button" className="settings-action" onClick={exportBackup} style={{ display:'flex', alignItems:'center', gap:'6px' }}><DownloadIcon size={16}/> ব্যাকআপ</button>
              </div>
              <div className="settings-row">
                <div className="settings-info" style={{ marginRight:'16px' }}><span className="settings-label">ডাটা রিস্টোর</span><span className="settings-desc">ব্যাকআপ ফাইল সিলেক্ট করে পুনরায় ইম্পোর্ট করুন।</span></div>
                <button type="button" className="settings-action" onClick={()=>document.getElementById('restore-file-input').click()} style={{ display:'flex', alignItems:'center', gap:'6px' }}><UploadIcon size={16}/> রিস্টোর</button>
                <input id="restore-file-input" type="file" accept=".json" style={{ display:'none' }} onChange={handleFileChange} />
              </div>
            </div>

            <div className="settings-section">
              <div className="settings-section-title" style={{ color:'var(--expense-color)' }}>ডাটা রিসেট</div>
              <div className="settings-row">
                <div className="settings-info"><span className="settings-label" style={{ color:'var(--expense-color)' }}>সব ডাটা মুছুন</span><span className="settings-desc">এই প্রোফাইলের সমস্ত হিসাব মুছে ফেলুন।</span></div>
                <button type="button" className="settings-action danger" onClick={()=>setIsClearConfirmOpen(true)}>মুছুন</button>
              </div>
            </div>

            <div className="credit-box">
              <div className="credit-app-name">হিসাবের খাতা</div>
              <div style={{ fontSize:'12px', color:'var(--text-muted)', marginBottom:'8px' }}>ভার্সন ১.০.০ (PWA)</div>
              <div className="credit-by" style={{ display:'flex', alignItems:'center', justifyContent:'center', gap:'4px' }}>
                <ShieldCheckIcon size={16} color="var(--primary)" /> App By Hasibul Alam
              </div>
            </div>
          </div>

          {isClearConfirmOpen && (
            <div className="modal-overlay" style={{ alignItems:'center' }} onClick={()=>setIsClearConfirmOpen(false)}>
              <div className="confirm-box" onClick={e=>e.stopPropagation()}>
                <div style={{ display:'flex', justifyContent:'center', color:'var(--expense-color)', marginBottom:'12px' }}><AlertIcon size={48}/></div>
                <div className="confirm-title" style={{ color:'var(--expense-color)' }}>সমস্ত ডাটা মুছবেন?</div>
                <div className="confirm-text">আপনি কি নিশ্চিত যে এই প্রোফাইলের সমস্ত হিসাব বিবরণী মুছে ফেলতে চান?</div>
                <div className="confirm-actions">
                  <button type="button" className="btn btn-secondary" onClick={()=>setIsClearConfirmOpen(false)}>বাতিল</button>
                  <button type="button" className="btn btn-danger" onClick={handleClear}>সব মুছুন</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // CORE APPLICATION CONTAINER (APP)
    // ==========================================
    function App() {
      const [currentUser, setCurrentUser] = useState(null);
      const [activeTab, setActiveTab] = useState('home');
      const [transactions, setTransactions] = useState([]);
      const [categories, setCategories] = useState(DEFAULT_CATEGORIES);
      const [initialSubTab, setInitialSubTab] = useState('all');
      const [initialStatusFilter, setInitialStatusFilter] = useState('all');
      const [initialCategoryFilter, setInitialCategoryFilter] = useState('all');
      
      const [isFormOpen, setIsFormOpen] = useState(false);
      const [transactionToEdit, setTransactionToEdit] = useState(null);

      useEffect(() => {
        const user = getCurrentUser();
        if (user) {
          setCurrentUser(user);
          setTransactions(getStoredTransactions(user.username));
          setCategories(getStoredCategories(user.username));
        }
      }, []);

      const handleLoginSuccess = (user) => {
        setCurrentUser(user);
        setTransactions(getStoredTransactions(user.username));
        setCategories(getStoredCategories(user.username));
        setActiveTab('home');
      };

      const handleLogout = () => {
        logoutUser();
        setCurrentUser(null);
        setTransactions([]);
      };

      const handleSaveTransaction = (payload) => {
        if (!currentUser) return;
        let updated = [];
        const isEdit = transactions.some(t => t.id === payload.id);
        if (isEdit) {
          updated = transactions.map(t => t.id === payload.id ? payload : t);
        } else {
          updated = [...transactions, payload];
        }
        updated.sort((a, b) => a.serial - b.serial);
        setTransactions(updated);
        saveStoredTransactions(updated, currentUser.username);
        setIsFormOpen(false);
        setTransactionToEdit(null);
      };

      const handleDeleteTransaction = (id) => {
        if (!currentUser) return;
        const updated = transactions.filter(t => t.id !== id);
        setTransactions(updated);
        saveStoredTransactions(updated, currentUser.username);
      };

      const handleRestoreSuccess = (newTxs, newCats) => {
        setTransactions(newTxs);
        setCategories(newCats);
      };

      const handleClearAllData = () => {
        setTransactions([]);
        setCategories(DEFAULT_CATEGORIES);
      };

      const handleViewSubTab = (subTabKey, statusFilterKey = 'all', categoryFilterKey = 'all') => {
        if (['borrowed', 'receivable', 'expense', 'owed'].includes(subTabKey)) {
          if (subTabKey === 'borrowed' || subTabKey === 'owed') {
            setInitialSubTab('i_owe');
            setInitialCategoryFilter(subTabKey);
            setInitialStatusFilter('all');
          } else if (subTabKey === 'receivable') {
            setInitialSubTab('they_owe');
            setInitialCategoryFilter('all');
            setInitialStatusFilter('all');
          } else if (subTabKey === 'expense') {
            setInitialSubTab('expense');
            setInitialCategoryFilter('all');
            setInitialStatusFilter('all');
          }
        } else {
          if (subTabKey === 'all_pending') {
            setInitialSubTab('all');
            setInitialStatusFilter('pending');
            setInitialCategoryFilter('all');
          } else if (subTabKey === 'all_partial') {
            setInitialSubTab('all');
            setInitialStatusFilter('partial');
            setInitialCategoryFilter('all');
          } else {
            setInitialSubTab(subTabKey);
            setInitialStatusFilter(statusFilterKey);
            setInitialCategoryFilter(categoryFilterKey);
          }
        }
        setActiveTab('history');
      };

      const handleAddWithAmount = (amount) => {
        setTransactionToEdit({ id: 'prefill-' + Date.now(), amount: amount });
        setIsFormOpen(true);
      };

      if (!currentUser) {
        return <AuthScreen onLoginSuccess={handleLoginSuccess} />;
      }

      const nextSerial = transactions.length > 0 
        ? Math.max(...transactions.map(t => t.serial)) + 1 
        : 1;

      return (
        <div className="app-container">
          <header className="app-header" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '16px 20px' }}>
            <div>
              <h1 className="header-title" style={{ margin: 0, fontSize: '24px' }}>হিসাবের খাতা</h1>
              <p className="header-subtitle" style={{ margin: '2px 0 0', display: 'flex', alignItems: 'center', gap: '4px' }}>
                👤 {currentUser.name}
              </p>
            </div>
            <button 
              onClick={handleLogout} 
              style={{ 
                background: 'rgba(255, 255, 255, 0.15)', 
                border: 'none', 
                borderRadius: '12px', 
                width: '40px',
                height: '40px',
                color: '#fff', 
                cursor: 'pointer',
                display: 'flex',
                alignItems: 'center',
                justifyContent: 'center',
                transition: 'background-color 0.2s',
                outline: 'none'
              }}
              title="প্রোফাইল লক করুন"
            >
              <LockIcon size={18} />
            </button>
          </header>

          {activeTab === 'home' && (
            <Dashboard 
              transactions={transactions} 
              categories={categories} 
              onAddClick={() => { setTransactionToEdit(null); setIsFormOpen(true); }} 
              onViewSubTab={handleViewSubTab} 
            />
          )}

          {activeTab === 'history' && (
            <TransactionHistory 
              transactions={transactions} 
              categories={categories} 
              onEdit={tx => { setTransactionToEdit(tx); setIsFormOpen(true); }} 
              onDelete={handleDeleteTransaction} 
              onUpdate={handleSaveTransaction}
              initialSubTab={initialSubTab}
              initialStatusFilter={initialStatusFilter}
              initialCategoryFilter={initialCategoryFilter} 
            />
          )}

          {activeTab === 'calculator' && (
            <CalculatorTab onAddWithAmount={handleAddWithAmount} />
          )}

          {activeTab === 'report' && (
            <Report transactions={transactions} categories={categories} />
          )}

          {activeTab === 'settings' && (
            <Settings 
              categories={categories} 
              onRestoreSuccess={handleRestoreSuccess} 
              onClearAllData={handleClearAllData} 
              currentUser={currentUser}
              onLogout={handleLogout}
              onProfileUpdate={handleLoginSuccess}
            />
          )}

          <nav className="bottom-nav">
            <button type="button" className={`nav-item ${activeTab === 'home' ? 'active' : ''}`} onClick={() => { setActiveTab('home'); setInitialSubTab('all'); setInitialStatusFilter('all'); setInitialCategoryFilter('all'); }}><HomeIcon /><span style={{marginTop:'2px'}}>হোম</span></button>
            <button type="button" className={`nav-item ${activeTab === 'history' ? 'active' : ''}`} onClick={() => { setActiveTab('history'); setInitialSubTab('all'); setInitialStatusFilter('all'); setInitialCategoryFilter('all'); }}><ListIcon /><span style={{marginTop:'2px'}}>হিসাব</span></button>
            <button type="button" className={`nav-item ${activeTab === 'calculator' ? 'active' : ''}`} onClick={() => setActiveTab('calculator')}><CalculatorIcon /><span style={{marginTop:'2px'}}>ক্যালকুলেটর</span></button>
            <button type="button" className={`nav-item ${activeTab === 'report' ? 'active' : ''}`} onClick={() => setActiveTab('report')}><ReportIcon /><span style={{marginTop:'2px'}}>রিপোর্ট</span></button>
            <button type="button" className={`nav-item ${activeTab === 'settings' ? 'active' : ''}`} onClick={() => setActiveTab('settings')}><SettingsIcon /><span style={{marginTop:'2px'}}>সেটিংস</span></button>
          </nav>

          <TransactionForm 
            isOpen={isFormOpen} 
            onClose={() => { setIsFormOpen(false); setTransactionToEdit(null); }} 
            onSave={handleSaveTransaction} 
            transactionToEdit={transactionToEdit} 
            categories={categories} 
            nextSerial={nextSerial} 
          />
        </div>
      );
    }

    // ==========================================
    // RENDER React DOM
    // ==========================================
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
