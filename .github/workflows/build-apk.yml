name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build PWA to APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: Hisaber_Khata_-main/package-lock.json

      - name: Install Node Dependencies
        working-directory: Hisaber_Khata_-main
        run: npm ci

      - name: Build Web Application
        working-directory: Hisaber_Khata_-main
        run: npm run build

      - name: Install Capacitor Core & CLI
        working-directory: Hisaber_Khata_-main
        run: npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Initialize Capacitor Project
        working-directory: Hisaber_Khata_-main
        run: npx cap init "Hisaber Khata" "com.hasib.hisaberkhata" --web-dir dist

      - name: Add Android Platform
        working-directory: Hisaber_Khata_-main
        run: npx cap add android

      - name: Copy Web Assets to Android
        working-directory: Hisaber_Khata_-main
        run: npx cap copy

      - name: Sync Capacitor
        working-directory: Hisaber_Khata_-main
        run: npx cap sync

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Build Android APK with Gradle
        working-directory: Hisaber_Khata_-main/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Hisaber-Khata-Debug-APK
          path: Hisaber_Khata_-main/android/app/build/outputs/apk/debug/app-debug.apk
